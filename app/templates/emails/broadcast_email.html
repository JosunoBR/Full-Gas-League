{% extends "emails/base_email.html" %}

{% block content %}
<div class="badge-category">{{ category or "COMUNICADO OFICIAL" }}</div>

<h2 style="color: #ffffff; margin-top: 0; font-size: 22px; font-weight: 700; line-height: 1.3;">
  {{ subject }}
</h2>

<div style="margin: 22px 0; color: #c9d1d9; font-size: 15px; line-height: 1.7;">
  {{ message_content | safe }}
</div>

<div style="text-align: center; margin-top: 30px;">
  <a href="{{ base_url or 'https://fullgasleague.com.br' }}" class="btn-action" target="_blank">
    Acessar Sistema FullGas
  </a>
</div>
{% endblock %}
